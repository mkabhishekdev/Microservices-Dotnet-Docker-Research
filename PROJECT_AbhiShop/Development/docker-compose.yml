networks:
    frontend:
    backend:

services:

    abhishop.webmvc:
       build:
        context: ./src/Web/AbhiShop.Webmvc
        dockerfile: Dockerfile
       environment:
       - ASPNETCORE_ENVIRONMENT=Development
       - InventoryUrl=http://inventory
       # Use a host LAN address reachable from both your browser and Docker.
       - IdentityUrl=${IDENTITY_URL:-http://192.168.1.2:5200}
       container_name: abhishopfront
       ports:
          - "5000:80"
       networks:
          - frontend
       depends_on:
          - inventory
          - tokenservice

    inventory:
       build:
        context: ./src/Services/InventoryManagementAPI
        dockerfile: Dockerfile
       environment: 
        - DatabaseServer=mssqlserver
        - DatabaseName=InventoryDb
        - DatabaseUser=sa
        - DatabaseUserPassword=Capstone11! 
        - DatabaseTrustServerCertificate=true
        - ASPNETCORE_ENVIRONMENT=Development
       container_name: inventoryapi
       ports:
         - "5100:80"
       networks:
        - backend
        - frontend
       depends_on:
        - mssqlserver
    
    tokenservice:
        build:
            context: ./src/Services/TokenServiceAPI
            dockerfile: Dockerfile
        environment: 
        - ASPNETCORE_ENVIRONMENT=Development
        - MvcClient=http://localhost:5000
        - ConnectionStrings__DefaultConnection=Server=mssqlserver;Database=TokenServiceDb;User Id=sa;Password=Capstone11!;TrustServerCertificate=true;
        container_name: tokenserviceapi
        ports:
            - "5200:80"
        networks:
            - backend
            - frontend
        depends_on:
            - mssqlserver

    mssqlserver:
        image: "mcr.microsoft.com/mssql/server:2022-latest"
        ports:
            - "1445:1433"
        container_name: mssqlcontainer
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=Capstone11!
        networks:
            - backend
